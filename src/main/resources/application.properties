spring.application.name=flashsale-inventory
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5444/flashsale}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
app.redis.address=${REDIS_ADDRESS:redis://localhost:6384}
app.lock.wait-seconds=${LOCK_WAIT_SECONDS:30}
